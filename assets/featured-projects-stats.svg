<svg width="820" height="324" viewBox="0 0 820 324" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Featured Projects: 36 total — Security &amp; DevSecOps 11, AI &amp; LLM Engineering 3, Systems &amp; Infrastructure 6, Web &amp; Product 2, Foundations 2, About Me 3, Learning &amp; Playgrounds 9">
  <style>
    text {
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      fill: #1f2328;
    }
    .header { font-size: 16px; font-weight: 700; letter-spacing: 0.5px; }
    .dim { fill: #6e7781; }
    .cursor { animation: blink 1.1s step-end infinite; }
    .blob { animation: drift 16s ease-in-out infinite alternate; }
    .b2 { animation-duration: 19s; animation-delay: -6s; }
    .b3 { animation-duration: 22s; animation-delay: -11s; }
    .b4 { animation-duration: 17s; animation-delay: -3s; }
    .sheen { animation: sweep 2.4s ease-in-out 0.5s 1 both; }
    @keyframes blink { 50% { opacity: 0; } }
    @keyframes drift { to { transform: translate(46px, 26px); } }
    @keyframes sweep { to { transform: translateX(1300px) skewX(-16deg); } }
    .label { font-size: 13px; font-weight: 600; }
    .count { font-size: 14px; font-weight: 700; }
    .pct { font-size: 12.5px; fill: #6e7781; }
    .total { font-size: 15px; font-weight: 700; }
    .hero { font-size: 40px; font-weight: 700; letter-spacing: -1px; }
    .hero-sub { font-size: 11px; font-weight: 600; letter-spacing: 1.5px; fill: #6e7781; }
    .slice { stroke-width: 28px; transition: stroke-width 0.25s ease, opacity 0.25s ease; cursor: pointer; }
    .pill { opacity: 0; transition: opacity 0.25s ease; }
    .row { cursor: pointer; }
    @keyframes spot { 0% { stroke-width: 28px; } 2.86% { stroke-width: 38px; } 11.43% { stroke-width: 38px; } 14.29% { stroke-width: 28px; } 100% { stroke-width: 28px; } }
    @keyframes rowspot { 0% { opacity: 0; } 2.86% { opacity: 1; } 11.43% { opacity: 1; } 14.29% { opacity: 0; } 100% { opacity: 0; } }
    .s1 { animation: draw1 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.15s backwards, spot 12.6s ease-in-out 1.79s infinite; }
    .r1 .pill { animation: rowspot 12.6s ease-in-out 1.79s infinite; }
    @keyframes draw1 { from { stroke-dasharray: 0 527.79; } }
    svg:has(.r1:hover) .s1, .s1:hover { stroke-width: 38px; opacity: 1; }
    svg:has(.s1:hover) .r1 .pill, .r1:hover .pill { opacity: 1; }
    .s2 { animation: draw2 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.27s backwards, spot 12.6s ease-in-out 3.59s infinite; }
    .r2 .pill { animation: rowspot 12.6s ease-in-out 3.59s infinite; }
    @keyframes draw2 { from { stroke-dasharray: 0 527.79; } }
    svg:has(.r2:hover) .s2, .s2:hover { stroke-width: 38px; opacity: 1; }
    svg:has(.s2:hover) .r2 .pill, .r2:hover .pill { opacity: 1; }
    .s3 { animation: draw3 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.39s backwards, spot 12.6s ease-in-out 5.39s infinite; }
    .r3 .pill { animation: rowspot 12.6s ease-in-out 5.39s infinite; }
    @keyframes draw3 { from { stroke-dasharray: 0 527.79; } }
    svg:has(.r3:hover) .s3, .s3:hover { stroke-width: 38px; opacity: 1; }
    svg:has(.s3:hover) .r3 .pill, .r3:hover .pill { opacity: 1; }
    .s4 { animation: draw4 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.51s backwards, spot 12.6s ease-in-out 7.19s infinite; }
    .r4 .pill { animation: rowspot 12.6s ease-in-out 7.19s infinite; }
    @keyframes draw4 { from { stroke-dasharray: 0 527.79; } }
    svg:has(.r4:hover) .s4, .s4:hover { stroke-width: 38px; opacity: 1; }
    svg:has(.s4:hover) .r4 .pill, .r4:hover .pill { opacity: 1; }
    .s5 { animation: draw5 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.63s backwards, spot 12.6s ease-in-out 8.99s infinite; }
    .r5 .pill { animation: rowspot 12.6s ease-in-out 8.99s infinite; }
    @keyframes draw5 { from { stroke-dasharray: 0 527.79; } }
    svg:has(.r5:hover) .s5, .s5:hover { stroke-width: 38px; opacity: 1; }
    svg:has(.s5:hover) .r5 .pill, .r5:hover .pill { opacity: 1; }
    .s6 { animation: draw6 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.75s backwards, spot 12.6s ease-in-out 10.79s infinite; }
    .r6 .pill { animation: rowspot 12.6s ease-in-out 10.79s infinite; }
    @keyframes draw6 { from { stroke-dasharray: 0 527.79; } }
    svg:has(.r6:hover) .s6, .s6:hover { stroke-width: 38px; opacity: 1; }
    svg:has(.s6:hover) .r6 .pill, .r6:hover .pill { opacity: 1; }
    .s7 { animation: draw7 0.8s cubic-bezier(0.22, 1, 0.36, 1) 0.87s backwards, spot 12.6s ease-in-out 12.59s infinite; }
    .r7 .pill { animation: rowspot 12.6s ease-in-out 12.59s infinite; }
    @keyframes draw7 { from { stroke-dasharray: 0 527.79; } }
    svg:has(.r7:hover) .s7, .s7:hover { stroke-width: 38px; opacity: 1; }
    svg:has(.s7:hover) .r7 .pill, .r7:hover .pill { opacity: 1; }
    /* real hover (SVG opened directly): stop the auto spotlight, dim the rest */
    svg:hover .slice, svg:hover .pill { animation-name: none; }
    svg:has(.slice:hover) .slice:not(:hover), svg:has(.row:hover) .slice { opacity: 0.35; }
    @media (prefers-reduced-motion: reduce) {
      .slice, .pill, .blob, .sheen, .cursor { animation: none !important; }
    }
  </style>

